<!DOCTYPE html>
<html><head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<title>Order Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: proof sheet — summary strip, then one card per item, options as a pick-one row */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1b2230; --muted:#5d6676; --line:#dde1e8;
  --accent:#2f4a7a; --accent-ink:#ffffff; --logo-filter:none;
  --ok:#1f7a4d; --ok-bg:#e3f3ea; --warn:#9a5b0c; --warn-bg:#fbefd9; --pend:#5d6676; --pend-bg:#eceef2;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1b212b; --ink:#e8ebf1; --muted:#9aa3b2; --line:#2c3441;
  --accent:#8fb0ea; --accent-ink:#0f1520; --logo-filter:invert(1);
  --ok:#6fd3a0; --ok-bg:#183327; --warn:#f2bd6b; --warn-bg:#3a2b14; --pend:#9aa3b2; --pend-bg:#262d38; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1b212b; --ink:#e8ebf1; --muted:#9aa3b2; --line:#2c3441;
  --accent:#8fb0ea; --accent-ink:#0f1520; --logo-filter:invert(1);
  --ok:#6fd3a0; --ok-bg:#183327; --warn:#f2bd6b; --warn-bg:#3a2b14; --pend:#9aa3b2; --pend-bg:#262d38; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px 24px;margin-bottom:14px}
.logo{width:min(260px,100%);height:auto;display:block;filter:var(--logo-filter)}
.contact{font-style:normal;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:14px;font-weight:500;user-select:text;min-width:0}
.contact span{overflow-wrap:anywhere}
@media (max-width:520px){.contact{align-items:flex-start}}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,5vw,36px);line-height:1.1;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}
.summary{display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.count{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.bar{flex:1 1 180px;height:8px;border-radius:99px;background:var(--pend-bg);overflow:hidden;min-width:0}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.notice{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px}
.card-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px}
.card-head > div{min-width:0}
.itemno{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
h2{font-family:var(--display);font-weight:500;font-size:21px;margin:2px 0 0;line-height:1.2}
.specs{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.specs b{color:var(--ink);font-weight:500}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip.pending{background:var(--pend-bg);color:var(--pend)}
.chip.approved{background:var(--ok-bg);color:var(--ok)}
.chip.changes{background:var(--warn-bg);color:var(--warn)}
.options{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.opt img{width:100%;aspect-ratio:3/5;object-fit:cover;border-radius:6px;display:block;max-width:100%}
.opt span{font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center}
.opt .letter{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--pend-bg);font-size:11px;font-weight:600}
.opt[aria-pressed="true"] .letter{background:var(--accent);color:var(--accent-ink)}
.single img{width:100%;max-width:340px;border-radius:8px;display:block}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font:600 14px var(--body);border-radius:8px;padding:10px 16px;cursor:pointer;border:1px solid transparent}
.btn.approve{background:var(--ok);color:var(--surface)}
.btn.change{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.link{background:none;border:none;color:var(--accent);padding:10px 4px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted)}
.notebox{display:flex;flex-direction:column;gap:8px}
textarea{font:14px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:80px;resize:vertical;width:100%;box-sizing:border-box}
.result{font-size:14px;border-radius:8px;padding:10px 12px}
.result.approved{background:var(--ok-bg);color:var(--ok)}
.result.changes{background:var(--warn-bg);color:var(--warn)}
.result p{margin:2px 0 0;color:var(--ink)}
.history{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.history h3{font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;margin:0 0 6px}
.history ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.history b{color:var(--ink);font-weight:500}
.history q{color:var(--ink)}
.who{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.who label{font-weight:600;font-size:14px}
.who input{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-width:360px;width:100%;box-sizing:border-box}
.who input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
footer{font-size:13px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}

.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.steps li{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.steps li i{display:block;height:6px;border-radius:99px;background:var(--pend-bg)}
.steps li.done i{background:var(--ok)} .steps li.now i{background:var(--accent)}
.steps li.done,.steps li.now{color:var(--ink)} .steps li.now{font-weight:600}
@media (max-width:560px){.steps{grid-template-columns:1fr}.steps li{flex-direction:row;align-items:center;gap:10px}.steps li i{width:28px;flex:none}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0;line-height:1.2}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.facts b{font-weight:500}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:center;gap:6px 14px;padding:11px 0;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0;padding-top:0}
.rows .nm{min-width:0;flex:1;overflow-wrap:anywhere}
.rows .sub{display:block;font-size:13px;color:var(--muted)}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.pend{background:var(--pend-bg);color:var(--pend)}
.todo .box{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;border:2px solid var(--line);margin-right:10px;flex:none;font-size:13px;font-weight:700}
.todo .done .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.todo .nm{display:flex;align-items:flex-start}
.allset{font-size:14px;border-radius:8px;padding:10px 12px;background:var(--ok-bg);color:var(--ok);font-weight:600}
.mock{font-size:13px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px}
footer{font-size:13px;color:var(--muted);text-align:center}
.notfound{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.todo .needed .box{border-color:var(--warn)}
.skeleton{color:var(--muted)}
</style>
</head>

    <h1 id="title">Your order</h1>
    <p class="lede" id="lede">Loading your order…</p>
  </header>
  <div id="main"></div>
  <footer>Questions? Email Orders@BundledGifting.com or call 1 (313) 600-2765.</footer>
</div>
<script>
const API = "PASTE_WEB_APP_URL_HERE";
function esc(s){ const d=document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
const key = new URLSearchParams(location.search).get("k") || "";
const main = document.getElementById("main");

function notFound(msg){
  document.getElementById("lede").textContent = "";
  main.innerHTML = `<div class="notfound">${esc(msg)}</div>`;
}

function render(o){
  document.title = o.name ? o.name + " · Order Status" : "Order Status";
  document.getElementById("title").textContent = o.name || "Your order";
  document.getElementById("lede").textContent = "Here's where your order stands. This page updates as your order moves along.";
  const steps = o.steps.map(s => `<li class="${s.state === "todo" ? "" : s.state}"><i></i>${esc(s.label)}</li>`).join("");
  const facts = [
    [o.delivery.label, o.delivery.value],
    ["Company", o.company], ["Bundles", o.bundles], ["Approved", o.approved],
    ["Tracking #", o.shipped ? (o.tracking || "Shipped") : "Once shipped"]
  ].filter(f => f[1]).map(f => `<div><span>${esc(f[0])}</span><b>${esc(f[1])}</b></div>`).join("");
  const open = o.todos.filter(t => !t.done).length;
  const todos = o.todos.map(t => `<li class="${t.done ? "done" : "needed"}"><span class="nm"><i class="box" aria-hidden="true">${t.done ? "✓" : ""}</i><span>${esc(t.label)}<span class="sub">${esc(t.sub)}</span></span></span><span class="chip ${t.done ? "ok" : "warn"}">${t.done ? "Done" : "Needed"}</span></li>`).join("");
  main.innerHTML = `
  <div style="display:flex;flex-direction:column;gap:22px">
  <section class="card" aria-labelledby="h-prog">
    <h2 id="h-prog">Progress</h2>
    <ol class="steps">${steps}</ol>
    <div class="facts">${facts}</div>
  </section>
  <section class="card todo" aria-labelledby="h-todo">
    <h2 id="h-todo">What we need from you</h2>
    ${open ? `<div class="mock">We need ${open} thing${open > 1 ? "s" : ""} from you to keep your order moving.</div>` : `<div class="allset">You're all set. Nothing needed from you right now.</div>`}
    <ul class="rows">${todos}</ul>
  </section></div>`;
}

if (!/^[a-f0-9]{12,40}$/.test(key)) notFound("We couldn't find this order. Please check the link we sent you, or contact us.");
else fetch(API + "?k=" + encodeURIComponent(key), {cache:"no-store"})
  .then(r => r.json())
  .then(j => j && j.ok ? render(j.order) : notFound("We couldn't find this order. Please check the link we sent you, or contact us."))
  .catch(() => notFound("We couldn't load your order right now. Please refresh in a minute, or contact us."));
</script>
</body>
</html>
